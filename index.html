<!DOCTYPE html>
<html lang="en" class="dark antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Class Routine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
          },
          colors: {
            bgPure: '#000000',
            cardHighlight: '#1c1c1e',
            borderSubtle: '#1f1f22',
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #000000;
      color: #f4f4f5;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-row {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    [contenteditable="true"] {
      outline: 1px dashed rgba(59, 130, 246, 0.6);
      border-radius: 4px;
      padding: 1px 6px;
      background: rgba(59, 130, 246, 0.08);
      transition: all 0.2s ease;
    }
    [contenteditable="true"]:focus {
      outline: 1px solid #3b82f6;
      background: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-500/30 selection:text-blue-200">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-black/85 backdrop-blur-md border-b border-borderSubtle px-4 sm:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3 sm:gap-5">
      <button id="btnToday" class="px-4 py-1.5 rounded-lg border border-zinc-700/80 text-zinc-200 text-sm font-medium hover:bg-zinc-900 hover:border-zinc-500 active:scale-95 transition-all">
        Today
      </button>
      
      <div class="flex items-center gap-1">
        <button id="btnPrevWeek" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900 transition-colors" title="Previous Week">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="btnNextWeek" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-zinc-900 transition-colors" title="Next Week">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <h1 id="weekRangeTitle" class="text-base sm:text-lg font-semibold tracking-tight text-white">
        Loading dates...
      </h1>

      <span id="liveClockBadge" class="hidden md:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950/60 text-emerald-400 border border-emerald-800/50">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="liveClockText"></span>
      </span>
    </div>

    <!-- Action Controls -->
    <div class="flex items-center gap-2.5">
      <button id="btnToggleEdit" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border border-zinc-800 bg-zinc-900/80 text-zinc-300 hover:text-white hover:border-zinc-700 transition-all flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        <span id="editBtnText">Edit Routine</span>
      </button>

      <button id="btnAddClass" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white transition-all flex items-center gap-1.5 shadow-lg shadow-blue-600/20">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        Add Class
      </button>
    </div>
  </header>

  <!-- Courses Filter Bar -->
  <section class="border-b border-borderSubtle bg-black px-4 sm:px-8 py-3 flex items-center gap-3 overflow-x-auto">
    <span class="text-[11px] font-semibold uppercase tracking-widest text-zinc-500 shrink-0">COURSES</span>
    <div id="coursePillsContainer" class="flex items-center gap-2"></div>
    <button id="btnClearFilter" class="hidden text-xs text-zinc-400 hover:text-white underline ml-2 shrink-0">Show All</button>
  </section>

  <!-- Main Schedule List -->
  <main id="scheduleContainer" class="flex-1 divide-y divide-borderSubtle max-w-6xl w-full mx-auto">
    <!-- Dynamically populated by JS -->
  </main>

  <!-- Add / Edit Class Modal -->
  <div id="classModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold text-white">Add Class Slot</h3>
        <button id="btnCloseModal" class="text-zinc-500 hover:text-zinc-300">✕</button>
      </div>
      <form id="classForm" class="space-y-4">
        <input type="hidden" id="formClassId">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Day of Week</label>
          <select id="formDayCode" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="2">Tuesday (TUE)</option>
            <option value="3">Wednesday (WED)</option>
            <option value="4">Thursday (THU)</option>
            <option value="5">Friday (FRI)</option>
            <option value="6">Saturday (SAT)</option>
            <option value="0">Sunday (SUN)</option>
            <option value="1">Monday (MON)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Course Code</label>
            <select id="formCourseCode" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></select>
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Time Slot</label>
            <input type="text" id="formTime" placeholder="8:30 AM - 11 AM" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Course Title</label>
          <input type="text" id="formTitle" placeholder="System Analysis and Design" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Room / Lab</label>
            <input type="text" id="formRoom" placeholder="424 - Computer Lab" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Initials</label>
            <input type="text" id="formInitials" placeholder="SS" maxlength="3" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Instructor</label>
            <input type="text" id="formTeacher" placeholder="Sayem Shahad" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" id="btnCancelModal" class="px-4 py-2 rounded-lg text-xs font-medium text-zinc-400 hover:bg-zinc-900">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white">Save Class</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Courses Metadata matching the screenshot colors
    const COURSES = [
      { code: 'CSE 4165', color: '#2563eb', bg: 'rgba(37, 99, 235, 0.16)', text: '#60a5fa' },
      { code: 'CSE 2218', color: '#16a34a', bg: 'rgba(22, 163, 74, 0.16)', text: '#4ade80' },
      { code: 'CSE 3411', color: '#ea580c', bg: 'rgba(234, 88, 12, 0.16)', text: '#fb923c' },
      { code: 'CSE 3412', color: '#9333ea', bg: 'rgba(147, 51, 234, 0.16)', text: '#c084fc' },
      { code: 'CSE 3521', color: '#db2777', bg: 'rgba(219, 39, 119, 0.16)', text: '#f472b6' },
      { code: 'SOC 2101', color: '#0891b2', bg: 'rgba(8, 145, 178, 0.16)', text: '#22d3ee' }
    ];

    // 2. Default Weekly Routine (mapped by JS day-of-week: 0=SUN, 1=MON, 2=TUE, 3=WED, 6=SAT)
    const DEFAULT_CLASSES = [
      // Tuesday (2)
      { id: 'c1', dayOfWeek: 2, time: '8:30 AM - 11 AM', course: 'CSE 2218', title: 'Data Structure and Algorithms II Laboratory', room: '424 - Computer Lab', initials: 'SS', teacher: 'Sayem Shahad' },
      { id: 'c2', dayOfWeek: 2, time: '11:11 AM - 12:30 PM', course: 'SOC 2101', title: 'Society, Environment and Engineering Ethics', room: '703', initials: 'TT', teacher: 'Taniah Mahmuda Tinni' },
      { id: 'c3', dayOfWeek: 2, time: '3:11 PM - 4:30 PM', course: 'CSE 3411', title: 'System Analysis and Design', room: '322', initials: 'TS', teacher: 'Tasmin Sanjida' },
      // Wednesday (3)
      { id: 'c4', dayOfWeek: 3, time: '8:30 AM - 11 AM', course: 'CSE 3412', title: 'System Analysis and Design Laboratory', room: '426 - Computer Lab', initials: 'TS', teacher: 'Tasmin Sanjida' },
      { id: 'c5', dayOfWeek: 3, time: '11:11 AM - 12:30 PM', course: 'CSE 3521', title: 'Database Management Systems', room: '402', initials: 'MT', teacher: 'Md. Shafqat Talukder' },
      // Saturday (6)
      { id: 'c6', dayOfWeek: 6, time: '11:11 AM - 12:30 PM', course: 'SOC 2101', title: 'Society, Environment and Engineering Ethics', room: '703', initials: 'TT', teacher: 'Taniah Mahmuda Tinni' },
      { id: 'c7', dayOfWeek: 6, time: '3:11 PM - 4:30 PM', course: 'CSE 3411', title: 'System Analysis and Design', room: '322', initials: 'TS', teacher: 'Tasmin Sanjida' },
      // Sunday (0)
      { id: 'c8', dayOfWeek: 0, time: '11:11 AM - 12:30 PM', course: 'CSE 3521', title: 'Database Management Systems', room: '402', initials: 'MT', teacher: 'Md. Shafqat Talukder' },
      // Monday (1)
      { id: 'c9', dayOfWeek: 1, time: '8:30 AM - 11 AM', course: 'CSE 4165', title: 'Web Programming', room: '427 - Computer Lab', initials: 'MH', teacher: 'Mahmudul Hasan' }
    ];

    // Order of days in a week cycle starting Tuesday -> Monday (matching screenshot)
    const WEEK_ORDER = [2, 3, 4, 5, 6, 0, 1];
    const DAY_NAMES = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const MONTH_NAMES = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const MONTH_TITLE = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    let routineData = JSON.parse(localStorage.getItem('cse_routine_v2')) || DEFAULT_CLASSES;
    let weekOffset = 0; // 0 = Current Real-Time Week
    let selectedCourse = null;
    let isEditMode = false;

    function saveRoutine() {
      localStorage.setItem('cse_routine_v2', JSON.stringify(routineData));
    }

    // Calculate the Tuesday-to-Monday dates for the active week
    function getCycleStartTuesday(baseDate, offsetWeeks = 0) {
      const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      const day = d.getDay(); // 0=Sun, 1=Mon, 2=Tue...
      // Distance back to the most recent Tuesday
      const diffToTuesday = (day >= 2) ? (day - 2) : (day + 5);
      d.setDate(d.getDate() - diffToTuesday + (offsetWeeks * 7));
      return d;
    }

    // Parse "8:30 AM - 11 AM" into minutes from midnight for live status detection
    function parseTimeRange(rangeStr) {
      try {
        const parts = rangeStr.split('-').map(s => s.trim());
        if (parts.length !== 2) return null;
        const toMins = (t) => {
          const match = t.match(/(\d+)(?::(\d+))?\s*(AM|PM)/i);
          if (!match) return null;
          let h = parseInt(match[1], 10);
          const m = parseInt(match[2] || '0', 10);
          const ampm = match[3].toUpperCase();
          if (ampm === 'PM' && h !== 12) h += 12;
          if (ampm === 'AM' && h === 12) h = 0;
          return h * 60 + m;
        };
        const start = toMins(parts[0]);
        const end = toMins(parts[1]);
        return (start !== null && end !== null) ? { start, end } : null;
      } catch {
        return null;
      }
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function renderCoursePills() {
      const container = document.getElementById('coursePillsContainer');
      const selectEl = document.getElementById('formCourseCode');
      container.innerHTML = '';
      selectEl.innerHTML = '';

      COURSES.forEach(c => {
        const active = selectedCourse === c.code;
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-full text-xs font-medium flex items-center gap-2 transition-all shrink-0 border ${
          active ? 'ring-2 ring-white/40 scale-105' : ' border-transparent opacity-90 hover:opacity-100'
        }`;
        btn.style.backgroundColor = c.bg;
        btn.style.color = c.text;
        btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background-color:${c.color}"></span>${c.code}`;
        btn.onclick = () => {
          selectedCourse = (selectedCourse === c.code) ? null : c.code;
          document.getElementById('btnClearFilter').classList.toggle('hidden', !selectedCourse);
          renderCoursePills();
          renderSchedule();
        };
        container.appendChild(btn);

        const opt = document.createElement('option');
        opt.value = c.code;
        opt.textContent = c.code;
        selectEl.appendChild(opt);
      });
    }

    function renderSchedule() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const startTuesday = getCycleStartTuesday(now, weekOffset);
      const endMonday = new Date(startTuesday);
      endMonday.setDate(startTuesday.getDate() + 6);

      // Update Header Range (e.g., "Oct 27 – Nov 2, 2026")
      const sameMonth = startTuesday.getMonth() === endMonday.getMonth();
      const rangeText = sameMonth
        ? `${MONTH_TITLE[startTuesday.getMonth()]} ${startTuesday.getDate()} – ${endMonday.getDate()}, ${endMonday.getFullYear()}`
        : `${MONTH_TITLE[startTuesday.getMonth()]} ${startTuesday.getDate()} – ${MONTH_TITLE[endMonday.getMonth()]} ${endMonday.getDate()}, ${endMonday.getFullYear()}`;
      document.getElementById('weekRangeTitle').textContent = rangeText;

      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      // Iterate through the 7 days of the Tuesday -> Monday cycle
      for (let i = 0; i < 7; i++) {
        const cellDate = new Date(startTuesday);
        cellDate.setDate(startTuesday.getDate() + i);
        const dayOfWeek = cellDate.getDay();
        const isToday = isSameDate(cellDate, now);

        // Filter classes for this weekday
        let dayClasses = routineData.filter(item => Number(item.dayOfWeek) === dayOfWeek);
        if (selectedCourse) {
          dayClasses = dayClasses.filter(item => item.course === selectedCourse);
        }

        // Only render days that have classes (or render Today even if empty so you always see Today)
        if (dayClasses.length === 0 && !isToday) continue;

        const dayRow = document.createElement('div');
        dayRow.id = isToday ? 'todayRow' : '';
        dayRow.className = `py-6 px-4 sm:px-8 flex flex-col sm:flex-row gap-4 sm:gap-8 items-start transition-colors animate-row`;

        // Left Date Column
        const leftCol = document.createElement('div');
        leftCol.className = 'w-16 shrink-0 flex sm:flex-col items-baseline sm:items-center gap-2 sm:gap-0.5 text-center select-none';
        leftCol.innerHTML = `
          <span class="text-[11px] font-semibold tracking-widest uppercase ${isToday ? 'text-blue-400' : 'text-zinc-400'}">${DAY_NAMES[dayOfWeek]}</span>
          <span class="text-2xl sm:text-[26px] leading-tight font-bold ${isToday ? 'text-blue-400' : 'text-white'}">${cellDate.getDate()}</span>
          <span class="text-[10px] font-medium tracking-widest uppercase text-zinc-500">${MONTH_NAMES[cellDate.getMonth()]}</span>
          ${isToday ? '<span class="mt-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30">TODAY</span>' : ''}
        `;

        // Right Classes Column
        const rightCol = document.createElement('div');
        rightCol.className = 'flex-1 w-full space-y-2.5';

        if (dayClasses.length === 0) {
          rightCol.innerHTML = `
            <div class="rounded-2xl bg-cardHighlight/60 border border-zinc-800/80 px-5 py-4 text-sm text-zinc-400">
              No classes scheduled for today. Enjoy your free day!
            </div>
          `;
        } else {
          dayClasses.forEach(cls => {
            const courseObj = COURSES.find(c => c.code === cls.course) || COURSES[0];
            const parsedTime = parseTimeRange(cls.time);
            const isLiveNow = isToday && parsedTime && currentMinutes >= parsedTime.start && currentMinutes <= parsedTime.end;
            const isUpNext = isToday && parsedTime && currentMinutes < parsedTime.start && (parsedTime.start - currentMinutes <= 60);

            const card = document.createElement('div');
            // Today's classes automatically get the dark rounded highlight card from the screenshot
            card.className = `group relative flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-8 px-4 py-3.5 rounded-2xl transition-all ${
              isToday
                ? 'bg-cardHighlight border border-zinc-800/90 shadow-lg'
                : 'hover:bg-zinc-900/50 border border-transparent'
            } ${isLiveNow ? 'ring-1 ring-emerald-500/60' : ''}`;

            card.innerHTML = `
              <!-- Time Column -->
              <div class="w-40 shrink-0 text-xs sm:text-[13px] font-medium text-zinc-400 flex items-center gap-2">
                <span data-field="time" data-id="${cls.id}" ${isEditMode ? 'contenteditable="true"' : ''}>${cls.time}</span>
              </div>

              <!-- Course Details -->
              <div class="flex-1 flex items-start gap-3.5">
                <span class="w-3 h-3 rounded-full mt-1.5 shrink-0 shadow-sm" style="background-color: ${courseObj.color}"></span>
                <div class="space-y-1 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <h2 data-field="title" data-id="${cls.id}" ${isEditMode ? 'contenteditable="true"' : ''} class="text-[15px] font-medium text-zinc-100 leading-snug">
                      ${cls.title}
                    </h2>
                    ${isLiveNow ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 animate-pulse">LIVE NOW</span>' : ''}
                    ${isUpNext ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/40">SOON</span>' : ''}
                  </div>
                  
                  <div class="flex flex-wrap items-center gap-2 text-xs text-zinc-400">
                    <span data-field="room" data-id="${cls.id}" ${isEditMode ? 'contenteditable="true"' : ''}>${cls.room}</span>
                    <span>·</span>
                    <span class="inline-flex items-center gap-1.5">
                      <span class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 text-[10px] font-bold inline-flex items-center justify-center border border-zinc-700">
                        ${cls.initials}
                      </span>
                      <span data-field="teacher" data-id="${cls.id}" ${isEditMode ? 'contenteditable="true"' : ''}>${cls.teacher}</span>
                    </span>
                  </div>
                </div>
              </div>

              <!-- Edit / Delete Controls -->
              <div class="${isEditMode ? 'flex' : 'hidden group-hover:flex'} items-center gap-1.5 self-end sm:self-center">
                <button onclick="openEditModal('${cls.id}')" class="p-1.5 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300" title="Edit Class">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                </button>
                <button onclick="deleteClass('${cls.id}')" class="p-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300" title="Delete Class">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            `;
            rightCol.appendChild(card);
          });
        }

        dayRow.appendChild(leftCol);
        dayRow.appendChild(rightCol);
        container.appendChild(dayRow);
      }

      // Attach inline editing listeners
      if (isEditMode) {
        document.querySelectorAll('[contenteditable="true"]').forEach(el => {
          el.addEventListener('blur', (e) => {
            const id = e.target.dataset.id;
            const field = e.target.dataset.field;
            const item = routineData.find(x => x.id === id);
            if (item && field) {
              item[field] = e.target.textContent.trim();
              saveRoutine();
            }
          });
        });
      }
    }

    // Live Clock & Automatic Roll-Over Check
    function updateLiveClock() {
      const now = new Date();
      const clockText = document.getElementById('liveClockText');
      if (clockText) {
        clockText.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

    // Modal & Controls Logic
    const modal = document.getElementById('classModal');
    const classForm = document.getElementById('classForm');

    window.openEditModal = function(id) {
      const cls = routineData.find(x => x.id === id);
      if (!cls) return;
      document.getElementById('modalTitle').textContent = 'Edit Class Slot';
      document.getElementById('formClassId').value = cls.id;
      document.getElementById('formDayCode').value = cls.dayOfWeek;
      document.getElementById('formCourseCode').value = cls.course;
      document.getElementById('formTime').value = cls.time;
      document.getElementById('formTitle').value = cls.title;
      document.getElementById('formRoom').value = cls.room;
      document.getElementById('formInitials').value = cls.initials;
      document.getElementById('formTeacher').value = cls.teacher;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.deleteClass = function(id) {
      if (confirm('Remove this class from your weekly routine?')) {
        routineData = routineData.filter(x => x.id !== id);
        saveRoutine();
        renderSchedule();
      }
    };

    document.getElementById('btnAddClass').onclick = () => {
      document.getElementById('modalTitle').textContent = 'Add Class Slot';
      classForm.reset();
      document.getElementById('formClassId').value = '';
      document.getElementById('formDayCode').value = new Date().getDay();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    const closeModal = () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };
    document.getElementById('btnCloseModal').onclick = closeModal;
    document.getElementById('btnCancelModal').onclick = closeModal;

    classForm.onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('formClassId').value;
      const newEntry = {
        id: id || 'c_' + Date.now(),
        dayOfWeek: Number(document.getElementById('formDayCode').value),
        course: document.getElementById('formCourseCode').value,
        time: document.getElementById('formTime').value.trim(),
        title: document.getElementById('formTitle').value.trim(),
        room: document.getElementById('formRoom').value.trim(),
        initials: document.getElementById('formInitials').value.trim().toUpperCase(),
        teacher: document.getElementById('formTeacher').value.trim()
      };

      if (id) {
        const idx = routineData.findIndex(x => x.id === id);
        if (idx > -1) routineData[idx] = newEntry;
      } else {
        routineData.push(newEntry);
      }
      saveRoutine();
      closeModal();
      renderSchedule();
    };

    // Navigation & Edit Mode Buttons
    document.getElementById('btnPrevWeek').onclick = () => { weekOffset--; renderSchedule(); };
    document.getElementById('btnNextWeek').onclick = () => { weekOffset++; renderSchedule(); };
    document.getElementById('btnToday').onclick = () => {
      weekOffset = 0;
      renderSchedule();
      const todayEl = document.getElementById('todayRow');
      if (todayEl) todayEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    document.getElementById('btnClearFilter').onclick = () => {
      selectedCourse = null;
      document.getElementById('btnClearFilter').classList.add('hidden');
      renderCoursePills();
      renderSchedule();
    };

    document.getElementById('btnToggleEdit').onclick = () => {
      isEditMode = !isEditMode;
      document.getElementById('editBtnText').textContent = isEditMode ? 'Done Editing' : 'Edit Routine';
      renderSchedule();
    };

    // Initialize and refresh live status every 60 seconds
    renderCoursePills();
    renderSchedule();
    updateLiveClock();
    setInterval(() => {
      updateLiveClock();
      if (!isEditMode && weekOffset === 0) renderSchedule();
    }, 60000);
  </script>
</body>
</html>
