<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Knowledge Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: '#060608', // Deep Void
            panelDark: '#121216', // Slate Noir
            borderDark: '#1f1f26', // Elevated Border
            brandGpt: '#10a37f',
            brandClaude: '#d97757',
            brandGemini: '#8a2be2',
            brandSynth: '#3b82f6',
            brandSynthHover: '#2563eb'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'glow-gpt': '0 0 25px -5px rgba(16, 163, 127, 0.35)',
            'glow-claude': '0 0 25px -5px rgba(217, 119, 87, 0.35)',
            'glow-gemini': '0 0 25px -5px rgba(138, 43, 226, 0.35)',
            'glow-synth': '0 0 25px -5px rgba(59, 130, 246, 0.35)',
            'card-hover': '0 10px 30px -10px rgba(0, 0, 0, 0.15)'
          }
        }
      }
    };
  </script>

  <style>
    body { transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
    .dark ::-webkit-scrollbar-thumb { background: #27272a; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    
    /* Elegant Markdown Rendering */
    .prose pre { background: #121216; color: #f4f4f5; padding: 1.5rem; border-radius: 1rem; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; margin: 1.5rem 0; border: 1px solid #1f1f26; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .prose code { font-family: 'JetBrains Mono', monospace; background: rgba(59, 130, 246, 0.1); padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.85em; color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
    .dark .prose code { color: #60a5fa; background: rgba(96, 165, 250, 0.1); border-color: rgba(96, 165, 250, 0.2); }
    .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #475569; font-weight: 400; }
    .dark .prose p { color: #94a3b8; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .prose h1, .prose h2, .prose h3, .prose h4 { font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #0f172a; letter-spacing: -0.025em; }
    .dark .prose h1, .dark .prose h2, .dark .prose h3, .dark .prose h4 { color: #f8fafc; }
    .prose h2 { font-size: 1.5rem; }
    .prose a { color: #3b82f6; text-decoration: none; border-bottom: 1px dashed #3b82f6; transition: all 0.2s; }
    .prose a:hover { border-bottom-style: solid; }

    /* Custom Hide Scrollbar for Tabs */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Keyframes & Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-panel {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-appBg text-slate-900 dark:text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

      </div>
      <div>

    <div class="flex items-center gap-3">

      </button>
      <button id="btnNew" class="bg-gradient-to-r from-slate-900 to-slate-800 dark:from-white dark:to-slate-200 text-white dark:text-slate-900 hover:opacity-95 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md shadow-slate-900/10 dark:shadow-white/10 flex items-center gap-2 active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        New Entry

    </div>
  </header>

  <!-- Main Layout -->

    <!-- Modern Sleek Sidebar -->

        <div class="relative group">

        <button onclick="createNew()" class="px-6 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold text-sm hover:scale-105 active:scale-95 transition-all shadow-xl shadow-slate-900/10 dark:shadow-white/10 flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Create New Entry

      </div>

      <!-- Active Editor/Viewer -->
      <div id="editorView" class="flex-1 flex flex-col overflow-hidden hidden">
        
        <!-- Workspace Header -->
        <div class="px-8 pt-8 pb-5 bg-white/60 dark:bg-[#0c0c0e]/80 backdrop-blur-md shrink-0 border-b border-slate-200/60 dark:border-borderDark/60">

          <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-brandSynth via-indigo-500 to-brandGemini rounded-2xl blur opacity-15 group-focus-within:opacity-30 transition duration-500"></div>
            <textarea id="docPrompt" rows="2" placeholder="What prompt generated these answers?" class="relative w-full text-xs md:text-sm bg-white dark:bg-panelDark border border-slate-200 dark:border-borderDark rounded-xl p-3.5 focus:outline-none focus:border-brandSynth/60 resize-y font-mono text-slate-700 dark:text-slate-300 shadow-xs"></textarea>
          </div>
        </div>

        <!-- Pill-Style Tabs & Mode Switcher Bar -->

          <div class="flex gap-1.5 overflow-x-auto hide-scrollbar p-1.5 bg-slate-200/60 dark:bg-panelDark/80 rounded-xl border border-slate-300/40 dark:border-borderDark">
            <button class="tab-btn active px-4 py-2 text-xs md:text-sm font-semibold rounded-lg flex items-center gap-2 transition-all bg-white dark:bg-borderDark text-brandGpt shadow-sm" data-tab="chatgpt">

            <button class="tab-btn px-4 py-2 text-xs md:text-sm font-semibold rounded-lg flex items-center gap-2 transition-all text-slate-500 hover:text-slate-800 dark:hover:text-slate-200" data-tab="gemini">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16.5c-2.35 0-4.5-1.95-4.5-4.5s2.15-4.5 4.5-4.5c.28 0 .55.05.82.12C20.69 4.09 17.65 1.5 14 1.5 9.58 1.5 6 5.08 6 9.5c0 4.42 3.58 8 8 8 3.65 0 6.69-2.59 7.82-6.12-.27.07-.54.12-.82.12zM13 15V9h2v6h-2z"/></svg>
              Gemini

            <button class="tab-btn px-4 py-2 text-xs md:text-sm font-semibold rounded-lg flex items-center gap-2 transition-all text-slate-500 hover:text-slate-800 dark:hover:text-slate-200" data-tab="synthesis">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              Synthesis

          </div>
          
          <!-- Mode Toggle -->
          <div class="flex bg-slate-200/60 dark:bg-panelDark/80 p-1 rounded-xl border border-slate-300/40 dark:border-borderDark">
            <button id="btnModeView" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-borderDark shadow-sm text-slate-800 dark:text-white transition-all">Read View</button>

          </div>
        </div>

        <!-- Content Scroll Area -->
        <div class="flex-1 overflow-y-auto px-8 py-6 bg-white/40 dark:bg-[#070709]/50 animate-fade-in">
          
          <!-- Edit Mode Textareas -->
          <div id="editContainer" class="hidden h-full">
            <textarea id="input-chatgpt" class="content-input w-full h-full bg-transparent border-0 p-0 font-mono text-sm focus:ring-0 resize-none text-slate-800 dark:text-slate-200 leading-relaxed" placeholder="Paste ChatGPT's insight here..."></textarea>
            <textarea id="input-claude" class="content-input w-full h-full bg-transparent border-0 p-0 font-mono text-sm focus:ring-0 resize-none text-slate-800 dark:text-slate-200 leading-relaxed hidden" placeholder="Paste Claude's insight here..."></textarea>
            <textarea id="input-gemini" class="content-input w-full h-full bg-transparent border-0 p-0 font-mono text-sm focus:ring-0 resize-none text-slate-800 dark:text-slate-200 leading-relaxed hidden" placeholder="Paste Gemini's insight here..."></textarea>
            <textarea id="input-synthesis" class="content-input w-full h-full bg-transparent border-0 p-0 font-mono text-sm focus:ring-0 resize-none text-slate-800 dark:text-slate-200 leading-relaxed hidden" placeholder="Synthesize your final solution or code here..."></textarea>
          </div>

          <!-- Read Mode Rendered Markdown -->
          <div id="readContainer" class="h-full">
            <div id="render-chatgpt" class="content-render prose dark:prose-invert max-w-[90ch] pb-12"></div>
            <div id="render-claude" class="content-render prose dark:prose-invert max-w-[90ch] pb-12 hidden"></div>
            <div id="render-gemini" class="content-render prose dark:prose-invert max-w-[90ch] pb-12 hidden"></div>

            <button id="btnSave" class="bg-gradient-to-r from-brandSynth to-indigo-600 text-white px-7 py-2.5 rounded-xl text-sm font-bold hover:opacity-95 transition-all shadow-lg shadow-blue-500/25 active:scale-95">Save Changes</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Firebase Scripts & App Logic -->
  <script type="module">

    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      authDomain: "ai-suggestion-tracker.firebaseapp.com",
      projectId: "ai-suggestion-tracker",
      storageBucket: "ai-suggestion-tracker.firebasestorage.app",

    const app = initializeApp(firebaseConfig);

    // Elements
    const sidebar = document.getElementById('sidebar');

    const vaultCount = document.getElementById('vaultCount');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('emptyState');
    const editorView = document.getElementById('editorView');
    
    const docTitle = document.getElementById('docTitle');

    const textareas = {

      claude: document.getElementById('input-claude'),
      gemini: document.getElementById('input-gemini'),
      synthesis: document.getElementById('input-synthesis')

    const renderers = {
      chatgpt: document.getElementById('render-chatgpt'),

      synthesis: document.getElementById('render-synthesis')

    const btnNew = document.getElementById('btnNew');
    const btnSave = document.getElementById('btnSave');
    const btnDelete = document.getElementById('btnDelete');
    const btnModeView = document.getElementById('btnModeView');
    const btnModeEdit = document.getElementById('btnModeEdit');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const btnBackMobile = document.getElementById('btnBackMobile');

    // Theme Setup
    const html = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    });

    // Fetch Data
    const q = query(collection(db, 'ai_insights'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
      vaultItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderList();
    });

    function renderList() {
      vaultList.innerHTML = '';
      const filtered = vaultItems.filter(item => 
        (item.title || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
        (item.prompt || '').toLowerCase().includes(searchTerm.toLowerCase())
      );

      vaultCount.textContent = filtered.length;

      filtered.forEach(item => {
        const li = document.createElement('li');
        const isActive = item.id === currentItemId;
        li.className = `p-3.5 rounded-2xl cursor-pointer transition-all border ${isActive ? 'bg-white dark:bg-panelDark border-brandSynth/40 shadow-md shadow-blue-500/5 translate-x-1' : 'border-transparent hover:bg-slate-200/50 dark:hover:bg-borderDark/40'}`;
        
        li.innerHTML = `
          <h3 class="font-bold text-sm ${isActive ? 'text-slate-900 dark:text-white' : 'text-slate-700 dark:text-slate-300'} truncate">${escapeHtml(item.title || 'Untitled Entry')}</h3>
          <p class="text-xs text-slate-400 dark:text-slate-500 truncate mt-1">${escapeHtml(item.prompt || 'No prompt specified...')}</p>
        `;
        
        li.addEventListener('click', () => openItem(item.id));
        vaultList.appendChild(li);
      });
    }

    function openItem(id) {
      currentItemId = id;
      const item = vaultItems.find(i => i.id === id);
      if (!item) return;

      docTitle.value = item.title || '';
      docPrompt.value = item.prompt || '';
      textareas.chatgpt.value = item.chatgpt || '';
      textareas.claude.value = item.claude || '';
      textareas.gemini.value = item.gemini || '';
      textareas.synthesis.value = item.synthesis || '';

      updateMarkdownRenderers();

      emptyState.classList.add('hidden');
      editorView.classList.remove('hidden');
      btnDelete.classList.remove('hidden');
      
      if(window.innerWidth < 768) sidebar.classList.add('-translate-x-full');

      renderList();
      setMode('view');
    }

    window.createNew = function() {
      currentItemId = null;
      docTitle.value = '';
      docPrompt.value = '';
      Object.values(textareas).forEach(t => t.value = '');
      
      emptyState.classList.add('hidden');
      editorView.classList.remove('hidden');
      btnDelete.classList.add('hidden');
      
      if(window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
      
      renderList();
      setMode('edit');
      docTitle.focus();
    }

    async function saveItem() {
      const data = {
        title: docTitle.value.trim(),
        prompt: docPrompt.value.trim(),
        chatgpt: textareas.chatgpt.value,
        claude: textareas.claude.value,
        gemini: textareas.gemini.value,
        synthesis: textareas.synthesis.value,
        updatedAt: serverTimestamp()
      };

      try {
        btnSave.innerHTML = '<span class="animate-pulse">Saving changes...</span>';
        if (currentItemId) {
          await updateDoc(doc(db, 'ai_insights', currentItemId), data);
        } else {
          data.createdAt = serverTimestamp();
          const docRef = await addDoc(collection(db, 'ai_insights'), data);
          currentItemId = docRef.id;
        }
        updateMarkdownRenderers();
        setMode('view');
      } catch (e) {
        alert("Error saving: " + e.message);
      } finally {
        btnSave.textContent = 'Save Changes';
      }
    }

    async function deleteItem() {
      if (!currentItemId) return;
      if (confirm('Are you sure you want to delete this entry permanently?')) {
        await deleteDoc(doc(db, 'ai_insights', currentItemId));
        currentItemId = null;
        editorView.classList.add('hidden');
        emptyState.classList.remove('hidden');
        
        if(window.innerWidth < 768) sidebar.classList.remove('-translate-x-full');
      }
    }

    function switchTab(tabId) {
      activeTab = tabId;
      
      tabBtns.forEach(btn => {
        const isTarget = btn.dataset.tab === tabId;
        const colorText = getBrandColorText(tabId);
        
        if (isTarget) {
          btn.className = `tab-btn active px-4 py-2 text-xs md:text-sm font-semibold rounded-lg flex items-center gap-2 transition-all bg-white dark:bg-borderDark shadow-sm ${colorText}`;
        } else {
          btn.className = `tab-btn px-4 py-2 text-xs md:text-sm font-semibold rounded-lg flex items-center gap-2 transition-all text-slate-500 hover:text-slate-800 dark:hover:text-slate-200`;
        }
      });

      Object.keys(textareas).forEach(key => {
        textareas[key].classList.toggle('hidden', key !== tabId);
        renderers[key].classList.toggle('hidden', key !== tabId);
      });
    }

    function setMode(mode) {
      editMode = mode === 'edit';
      const readContainer = document.getElementById('readContainer');
      const editContainer = document.getElementById('editContainer');
      
      if (editMode) {
        btnModeEdit.className = 'px-4 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-borderDark shadow-sm text-slate-800 dark:text-white transition-all';
        btnModeView.className = 'px-4 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all';
        readContainer.classList.add('hidden');
        editContainer.classList.remove('hidden');
      } else {
        btnModeView.className = 'px-4 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-borderDark shadow-sm text-slate-800 dark:text-white transition-all';
        btnModeEdit.className = 'px-4 py-1.5 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all';
        readContainer.classList.remove('hidden');
        editContainer.classList.add('hidden');
        updateMarkdownRenderers();
      }
    }

    function updateMarkdownRenderers() {
      marked.use({ breaks: true, gfm: true });
      Object.keys(textareas).forEach(key => {
        const rawText = textareas[key].value || `*No insight added for ${key} yet.*`;
        renderers[key].innerHTML = marked.parse(rawText);
      });
    }

    function escapeHtml(unsafe) {
      return (unsafe || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function getBrandColorText(tab) {
      const map = { chatgpt: 'text-brandGpt', claude: 'text-brandClaude', gemini: 'text-brandGemini', synthesis: 'text-brandSynth' };
      return map[tab] || 'text-brandSynth';
    }

    btnNew.addEventListener('click', window.createNew);
    btnSave.addEventListener('click', saveItem);
    btnDelete.addEventListener('click', deleteItem);
    btnModeView.addEventListener('click', () => setMode('view'));
    btnModeEdit.addEventListener('click', () => setMode('edit'));
    searchInput.addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });
    btnBackMobile.addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));

    tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    document.addEventListener('keydown', (e) => {
      if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (!editorView.classList.contains('hidden')) saveItem();
      }
    });

    switchTab('chatgpt');
    setTimeout(() => { if(vaultItems.length === 0) emptyState.classList.remove('hidden'); }, 500);
  </script>
</body>
</html>
